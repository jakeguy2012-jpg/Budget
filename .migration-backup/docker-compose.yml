services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: family_finance
      POSTGRES_PASSWORD: family_finance_password
      POSTGRES_DB: family_finance_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_finance -d family_finance_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://family_finance:family_finance_password@db:5432/family_finance_hub?schema=public}
      PORT: ${PORT:-3000}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm run start"

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://family_finance:family_finance_password@db:5432/family_finance_hub?schema=public}
    command: sh -c "npx prisma migrate deploy && npm run worker"

volumes:
  postgres_data:

kind = "web"
previewPath = "/"
title = "Family Finance Hub"
version = "1.0.0"
id = "artifacts/family-finance-hub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18279

[services.development]
run = "pnpm --filter @workspace/family-finance-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/family-finance-hub", "run", "build" ]
publicDir = "artifacts/family-finance-hub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18279"
BASE_PATH = "/"

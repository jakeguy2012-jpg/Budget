kind = "mobile"
previewPath = "/mobile/"
title = "Family Finance Hub Mobile"
version = "1.0.0"
id = "artifacts/family-finance-hub-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 21802

[services.development]
run = "pnpm --filter @workspace/family-finance-hub-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/family-finance-hub-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/family-finance-hub-mobile", "run", "serve" ]

[services.env]
PORT = "21802"
BASE_PATH = "/mobile/"
